name: Research framework checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.12'
      - name: Install locked core environment
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev
      - name: Run fitting tests in tmux
        run: |
          tmux new-session -d -s checks "bash scripts/checks.sh > checks.log 2>&1; echo \$? > checks.exit"
          while [ ! -f checks.exit ]; do sleep 2; done
          cat checks.log
          exit "$(cat checks.exit)"
